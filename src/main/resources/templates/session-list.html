<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base-layout::layout(~{::.app-container})}">
<body>
<section class="app-container">
        <header class="top-header">
            <div class="header-left">
                <span>홈</span>
                <i class="fa-solid fa-caret-down"></i>
            </div>
            <div class="header-right">
                <i class="fa-solid fa-list-ul"></i>
                <i class="fa-solid fa-user-plus"></i>
                <i class="fa-solid fa-bell"></i>
            </div>
        </header>

        <section class="quick-menu">
            <div class="menu-item">
                <div class="icon-box red-icon">
                    <i class="fa-solid fa-forward"></i>
                </div>
                <span>빠른기록</span>
            </div>
            <div class="menu-item">
                <div class="icon-box green-icon">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <span>플릭AI</span>
            </div>
            <div class="menu-item">
                <div class="icon-box yellow-icon">
                    <i class="fa-solid fa-rocket"></i>
                </div>
                <span>프로그램</span>
            </div>
        </section>

        <section class="routine-section">
            <div class="section-title">
                <h2>내 루틴</h2>
                <div class="filters">
                    <span>최근 <i class="fa-solid fa-caret-down"></i></span>
                    <span>요약 <i class="fa-solid fa-caret-down"></i></span>
                </div>
            </div>
            <div class="view-toggle">
                <button class="active"><i class="fa-solid fa-list"></i></button>
                <button><i class="fa-solid fa-border-all"></i></button>
            </div>
        </section>

        <div class="card-list">
            <div class="card" th:each="workoutSession:${workoutSessions}">
                <div class="card-icon">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <a class="card-content a-to-div" th:href="@{session/{id}(id=${workoutSession.id})}">
                    <h3 th:text="${workoutSession.title}">초심자 가슴+팔</h3>
                    <p class="tags">가슴, 어깨</p>
                    <p class="time">6시간 전</p>
                </a>
                <div class="card-menu">
                    <i class="fa-solid fa-ellipsis"></i>
                </div>
            </div>
        </div>

        <div class="bottom-actions">
            <button class="btn-primary">
                <i class="fa-solid fa-bolt"></i> 자유운동
            </button>
            <button class="btn-secondary">
                <a th:href="@{session/add}">
                    <i class="fa-solid fa-plus"></i> 추가
                </a>
            </button>
        </div>

        <div class="spacer"></div>
    <nav class="bottom-nav">
        <div class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>홈</span>
        </div>
        <div class="nav-item">
            <i class="fa-regular fa-calendar"></i>
            <span>기록</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-chart-simple"></i>
            <span>통계</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-user-group"></i>
            <span>소셜</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-bars"></i>
            <span>메뉴</span>
        </div>
    </nav>
</section>
</body>
</html>
