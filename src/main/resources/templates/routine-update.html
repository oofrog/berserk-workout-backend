<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base-layout::layout(~{::.app-container})}">
<body>
    <section class="app-container">
        <div class="status-header">
            <a th:href="@{/session}">
                <div class="back-btn">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
            </a>
        </div>
        <div class="update-box">
            <form action="index.html" class="update-form">
                <input type="text" th:value="${workoutSession.title}" class="update-input">
                <button class="update-btn">수정</button>
            </form>
            <form action="index.html" class="update-form">
                <button class="delete-btn">루틴 삭제</button>
            </form>
        </div>
    </section>
</body>
</html>
