<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base-layout::layout(~{::.app-container})}">
<body>
    <section class="app-container">
        <div class="status-header">
            <a th:href="@{/session}">
                <div class="back-btn">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
            </a>
        </div>
        <div class="update-box">
            <form th:action="@{/session/update(id=${workoutSession.id})}" th:method="post" class="update-form">
                <input type="text" class="update-input" name="title"
                       th:value="${workoutSession.title}">
                <button type="submit" class="update-btn">수정</button>
            </form>
            <form th:action="@{/session/delete(id=${workoutSession.id})}" th:method="post" class="update-form">
                <button type="submit" class="delete-btn">루틴 삭제</button>
            </form>
        </div>
    </section>
</body>
</html>
