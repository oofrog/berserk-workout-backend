<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base-layout::layout(~{::.app-container})}">
<body>
    <section class="app-container">
        <div class="status-header">
        </div>

        <div class="routine-list">
            <div class="routine" th:each="workoutSession:${workoutSessions}">
                <div class="routine-icon">
                    <i class="fa-solid fa-dumbbell"></i>
                </div>
                <a th:href="@{session/{id}(id=${workoutSession.id})}">
                    <div class="routine-content">
                        <span th:text="${workoutSession.title}">새 루틴</span>
                    </div>
                </a>
                <a th:href="@{session/update(id=${workoutSession.id})}">
                    <div>
                        <i class="fa-solid fa-gear"></i>
                    </div>
                </a>
            </div>
            
            <div class="routine add-routine">
                <div class="routine-icon">
                    <i class="fa-solid fa-plus"></i>
                </div>  
                <a th:href="@{session/add}">
                    <div class="routine-content">
                        <span>루틴 만들기</span>
                    </div>
                </a>
            </div>
            <a href="">
                <div class="free-workout-btn">
                    <i class="fa-solid fa-circle-play"></i>
                    <span>자유 운동 시작</span>
                </div>
            </a>
        </div>
    </section>
</body>
</html>
