<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base-layout::layout(~{::.app-container})}">

<body>
<div class="app-container">
    <header class="search-header">
        <i class="fa-solid fa-chevron-left back-btn"></i>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="검색">
        </div>
        <i class="fa-solid fa-plus add-icon"></i>
    </header>

    <section class="filter-tags">
        <div class="tag-row">
            <span class="tag active-red">전체</span>
            <span class="tag">좋아하는</span>
            <span class="tag">자주하는</span>
            <span class="tag">최근</span>
            <span class="tag">커스텀</span>
        </div>
        <div class="tag-row">
            <span class="tag active-green">전체</span>
            <span class="tag">가슴</span>
            <span class="tag">등</span>
            <span class="tag">어깨</span>
            <span class="tag">삼두</span>
            <span class="tag">이두</span>
        </div>
    </section>

    <button class="custom-add-btn">
        <i class="fa-solid fa-circle-plus"></i> 커스텀 운동 추가
    </button>

    <form th:action="@{add}" method="POST" id="exerciseForm">

        <div class="add-exercise-list">

            <div class="add-ex-item"
                 th:each="exercise : ${exerciseList}"
                 th:onclick="|toggleSelection(${exercise.id})|"
                 th:id="|item-${exercise.id}|">

                <input type="checkbox"
                       name="exerciseIds"
                       th:value="${exercise.id}"
                       th:id="|check-${exercise.id}|"
                       class="hidden-checkbox">

                <div class="ex-img-box">
                    <img th:src="@{/img/berserk-logo.webp}" alt="운동 이미지" class="ex-img">
                </div>

                <div class="ex-info">
                    <h3>
                        <span th:text="${exercise.name}">운동 이름</span>
                        <i class="fa-solid fa-check check-mark"></i>
                    </h3>
                    <p>자극 부위</p>
                </div>

                <i class="fa-solid fa-ellipsis ex-menu"></i>
            </div>
        </div>

        <div class="bottom-add-actions">
            <button type="button" class="action-btn btn-upload">
                <i class="fa-solid fa-arrow-up"></i>
            </button>

            <button type="submit" class="action-btn btn-add-main">
                <i class="fa-solid fa-plus"></i> <span id="count-badge">0</span>
                <span th:if="${type == 'new'}"> 루틴 생성 </span>
                <span th:if="${type == 'patch'}"> 운동 추가 </span>
            </button>


            <button type="button" class="action-btn btn-refresh">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>

    </form>

    <div class="spacer" style="height: 80px;"></div>
</div>
</body>
</html>
